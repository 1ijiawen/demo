<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>用户注册 - 我的个人网站</title>
</head>

<body>

    <header>
        <h1>用户注册</h1>
        <p>欢迎来到我的注册表单练习页面。</p>
    </header>

    <nav>
        <a href="index.html">返回首页</a>
    </nav>

    <main>

        <section>
            <label for="school">学校：</label>
            <input type="text" id="school" name="school" placeholder="请输入学校">

            <label for="college">学院：</label>
            <input type="text" id="college" name="college" placeholder="请输入学院">

            <label for="class">班级：</label>
            <input type="text" id="class" name="class" placeholder="请输入班级"><br>
        </section>

        <section>
            <form>

                <p>
                    <label for="username">用户名：</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名">
                </p>

                <p>
                    <label for="email">电子邮箱：</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱">
                </p>

                <p>
                    <label for="password">密码：</label>
                    <input type="password" id="password" name="password" placeholder="请输入测试密码">
                </p>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 我的 HTML 学习网站</p>
    </footer>

</body>

</html>
