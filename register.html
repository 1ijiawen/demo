<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>用户注册 - 我的个人网站</title>
</head>

<body>

    <header>
        <h1>用户注册</h1>
        <p>欢迎来到我的注册表单练习页面。</p>
    </header>

    <nav>
        <a href="index.html">返回首页</a>
    </nav>

    <main>

        <section>
            <form action="register.html" method="get">

                <p>
                    <label for="username">用户名：</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名">
                </p>

                <p>
                    <label for="email">电子邮箱：</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱">
                </p>

                <p>
                    <label for="password">密码：</label>
                    <input type="password" id="password" name="password" placeholder="请输入测试密码">
                </p>

                <p>
                    <label for="age">年龄：</label>
                    <input type="number" id="age" name="age" min="18" max="100">
                </p>

                <p>
                    <label for="birthday">出生日期：</label>
                    <input type="date" id="birthday" name="birthday">
                </p>

                <fieldset>
                    <legend>你的 HTML 学习水平：</legend>

                    <input type="radio" id="beginner" name="level" value="beginner" checked>
                    <label for="beginner">初学者</label>

                    <input type="radio" id="intermediate" name="level" value="intermediate">
                    <label for="intermediate">有一定基础</label>

                    <input type="radio" id="advanced" name="level" value="advanced">
                    <label for="advanced">比较熟练</label>
                </fieldset>

                <fieldset>
                    <legend>你感兴趣的技术：</legend>

                    <input type="checkbox" id="interest-html" name="interests" value="html">
                    <label for="interest-html">HTML</label>

                    <input type="checkbox" id="interest-css" name="interests" value="css">
                    <label for="interest-css">CSS</label>

                    <input type="checkbox" id="interest-js" name="interests" value="javascript">
                    <label for="interest-js">JavaScript</label>
                </fieldset>

                <p>
                    <label for="message">学习感想：</label>
                </p>

                <p>
                    <textarea id="message" name="message" rows="5" cols="30" placeholder="分享你的 HTML 学习感想"></textarea>
                </p>

                <p>
                    <button type="submit">提交表单</button>

                    <button type="reset">重置表单</button>
                </p>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 我的 HTML 学习网站</p>
    </footer>

</body>

</html>
