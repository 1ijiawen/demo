<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册练习 - 我的个人网站</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>用户注册练习</h1>
        <p>欢迎来到我的 HTML 注册页面。</p>
    </header>

    <nav aria-label="主要导航">
        <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="about.html">关于我</a></li>
            <li><a href="study.html">学习计划</a></li>
            <li><a href="register.html" aria-current="page">注册</a></li>
            <li><a href="login.html">登录</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>注册表单练习</h2>
            <p>
                这是 HTML 表单学习项目。
                本页面不会创建真实账号。
            </p>
            <form id="register-form">

                <p>
                    <label for="username">用户名：</label>
                    <input type="text" id="username" name="username" minlength="3" maxlength="20" required>
                </p>

                <p>
                    <label for="email">电子邮箱：</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="password">密码：</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </p>

                <p>
                    <label for="confirm">确认密码：</label>
                    <input type="password" id="confirm" name="confirm" minlength="8" required>
                </p>

                <fieldset>
                    <legend>HTML 学习水平</legend>

                    <input type="radio" id="beginner" name="level" value="beginner" checked>
                    <label for="beginner">初学者</label>

                    <input type="radio" id="intermediate" name="level" value="intermediate">
                    <label for="intermediate">有一定基础</label>
                </fieldset>

                <p>
                    <input type="checkbox" id="agreement" name="agreement" required>
                    <label for="agreement">我了解这只是课堂练习</label>
                </p>

                <button type="submit">注册</button>
                <button type="reset">重置</button>

                <p>
                    已有账号？前往登录
                    <a href="login.html">前往登录页面</a>
                </p>

            </form>

        </section>

        <section>
            <h2>学习者资料</h2>
            <p>
                <label for="learner-age">年龄：</label>
                <input type="number" id="learner-age" name="learnerAge" min="1" max="120" step="1" required>
            </p>
            <p>
                <label for="learner-start-date">学习开始日期：</label>
                <input type="date" id="learner-start-date" name="learnerStartDate">
            </p>
            <fieldset>
                <legend>感兴趣的技术：</legend>

                <input type="checkbox" id="tech-html" name="techInterests" value="HTML">
                <label for="tech-html">HTML</label>

                <input type="checkbox" id="tech-css" name="techInterests" value="CSS">
                <label for="tech-css">CSS</label>

                <input type="checkbox" id="tech-js" name="techInterests" value="JavaScript">
                <label for="tech-js">JavaScript</label>

            </fieldset>
            <p>
                <label for="learner-goal">学习目标：</label>
                <textarea id="learner-goal" name="learnerGoal" rows="4"></textarea>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 我的 HTML 学习网站</p>
    </footer>

    <script>
        document.getElementById("register-form")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                alert("验证通过。这只是练习，没有创建账号。");
            });
    </script>

</body>

</html>
